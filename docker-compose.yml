services:
  # ── MariaDB ───────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: ereseta
      MARIADB_USER: ereseta
      MARIADB_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel REST API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ereseta
      DB_USERNAME: ereseta
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost:5173
      FABRIC_GATEWAY_URL: http://gateway:3001
      QUEUE_CONNECTION: sync
    volumes:
      - ./api:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # ── React SPA (dev server) ─────────────────────────────────────────────────
  web:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # ── Fabric Gateway (Node.js) ───────────────────────────────────────────────
  gateway:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      CHANNEL_NAME: ereseta-channel
      CHAINCODE_NAME: prescription
      PEER_ENDPOINT: peer0.deamhi.example.com:7051
      PEER_HOST_ALIAS: peer0.deamhi.example.com
      CRYPTO_PATH: /app/network/crypto-config
    volumes:
      - ./blockchain/gateway:/app
      - ./blockchain/network:/app/network
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
