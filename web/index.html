<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0077b6" />
    <meta name="description" content="eReseta+ - electronic prescription and patient records system for Dr. Eutiquio Ll. Atanacio Jr. Memorial Hospital." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="eReseta+" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>eReseta+ - DEAMHI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Blank-page recovery. If a stale offline copy (old service worker) points at bundle files
      // that no longer exist, the app never mounts and the page stays empty with no error.
      // When nothing has rendered after 10s, drop the service worker + caches and reload once.
      (function () {
        var KEY = 'ereseta-recovery-attempted';
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length) { sessionStorage.removeItem(KEY); return; }
          if (sessionStorage.getItem(KEY)) return; // already tried this session — never loop
          sessionStorage.setItem(KEY, '1');
          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }));
          }
          if ('caches' in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
