<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0077b6" />
    <title>eReseta+ - Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f9fb;
        color: #172033;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        border: 1px solid #dce5ec;
        border-radius: 18px;
        background: white;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }
      .mark {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: #0077b6;
        color: white;
        font-weight: 800;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }
      p {
        margin: 10px 0 0;
        color: #5d6f84;
        line-height: 1.6;
      }
      button {
        margin-top: 22px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: #0077b6;
        color: white;
        font-weight: 700;
        padding: 13px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">e+</div>
      <h1>You are offline</h1>
      <p>eReseta+ needs a connection to show appointments, records, and prescriptions. Reconnect to continue safely.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
