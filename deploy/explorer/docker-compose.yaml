# Hyperledger Explorer for the DEAMHI Fabric network (read-only observer).
# Runs alongside the existing Fabric network; joins the same Docker network so it can
# reach peer0.deamhi.example.com by hostname. Web UI bound to 127.0.0.1 (PRIVATE — reach
# it via SSH tunnel, never exposed to the internet).
#
# Deploy:   cd deploy/explorer && docker compose up -d
# Rollback: docker compose down            (removes ONLY explorer + its db; app/Fabric untouched)
# Access:   on your laptop → ssh -L 8080:localhost:8080 ubuntu@<server> → http://localhost:8080

volumes:
  pgdata:
  walletstore:

networks:
  # Join the EXISTING Fabric network (created by compose-deamhi.yaml) so Explorer can
  # resolve peer0.deamhi.example.com. Confirm the name with: docker network ls | grep fabric
  fabric_deamhi:
    external: true

services:
  explorerdb.deamhi:
    image: hyperledger/explorer-db:latest
    container_name: explorerdb.deamhi
    hostname: explorerdb.deamhi
    environment:
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWORD=password        # internal DB only (not exposed); change if you like
    healthcheck:
      test: "pg_isready -h localhost -p 5432 -q -U postgres"
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fabric_deamhi

  explorer.deamhi:
    # ⚠️ VERIFY-POINT: pin a tag compatible with Fabric 2.5 (check the Explorer compatibility
    # matrix). If :latest doesn't connect on first run, swap to a known-good version tag.
    image: hyperledger/explorer:latest
    container_name: explorer.deamhi
    hostname: explorer.deamhi
    environment:
      - DATABASE_HOST=explorerdb.deamhi
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWD=password
      - LOG_LEVEL_APP=info
      - LOG_LEVEL_DB=info
      - LOG_LEVEL_CONSOLE=debug
      - LOG_CONSOLE_STDOUT=true
      - DISCOVERY_AS_LOCALHOST=false      # peer is reached by container hostname, not localhost
      - PORT=8080
    volumes:
      - ./config.json:/opt/explorer/app/platform/fabric/config.json
      - ./connection-profile:/opt/explorer/app/platform/fabric/connection-profile
      # Mount the live crypto READ-ONLY; the connection profile references it under /tmp/crypto
      - /home/ubuntu/ereseta-fabric/organizations:/tmp/crypto:ro
      - walletstore:/opt/explorer/wallet
    ports:
      - 127.0.0.1:8080:8080               # LOCALHOST ONLY = private (SSH-tunnel to reach it)
    depends_on:
      explorerdb.deamhi:
        condition: service_healthy
    networks:
      - fabric_deamhi
